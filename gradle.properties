# AGP 8.13.1 requires the Gradle daemon to run on JDK 17+. JDK 11 is also installed on this
# machine and remains the system default (JAVA_HOME), so the build pins 17 explicitly here
# rather than changing anything global. Forward slashes: this file is java.util.Properties.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.19.10-hotspot

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

kotlin.code.style=official
